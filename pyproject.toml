[project]
name = "mpinn"
version = "0.1.4"
description = "Библиотека для решения задач стационарной тплопроводности при помощи ФИНС"
authors = [
    {name = "Kashnikov-AV",email = "egkashnikov@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
]
readme = "README.md"
packages = [
    { include = "mpinn" }
]
exclude = [
    ".github/",
    "docs/",
    "tests/",
    "venv/",
    "*.ipynb",
    "main_1d.py",
    ".gitignore",
    "poetry.lock",
    "colocation_example.ipynb",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
